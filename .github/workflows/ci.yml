name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: CI verification
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm 10
        run: npm install --global npm@10

      - name: Install dependencies
        run: npm ci

      - name: Check API TypeScript
        run: npm run api:typecheck

      - name: Check API test TypeScript
        run: npm run api:test:typecheck

      - name: Check frontend TypeScript
        run: npm run web:typecheck

      - name: Run API tests
        run: npm run api:test
        env:
          NODE_ENV: test

      - name: Build backend and frontend for production
        run: npm run build
